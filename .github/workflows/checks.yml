name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install pinned test tools
        run: pnpm install --frozen-lockfile

      - name: Every module parses
        run: pnpm run check:syntax

      - name: Both home pages keep the same layout
        run: node test/home-parity.test.mjs

      - name: Tutorial and patch notes match this release
        run: node test/guide-contract.test.mjs && node test/branding.test.mjs

      - name: Seasonal artwork, install identity and offline rollover
        run: |
          node test/seasonal.test.mjs
          node test/seasonal-assets.test.mjs

      - name: Profiles, competitive game logic and notification taps
        run: |
          node test/practice.test.mjs
          node test/navigation-attention.test.mjs
          node test/word-celebration.test.mjs
          node test/daily-word.test.mjs
          node test/daily-puzzles.test.mjs
          node test/seasonal-puzzles.test.mjs
          node test/weekly-report.test.mjs
          node test/memory-catalog.test.mjs
          node test/couple-game.test.mjs
          node test/game-sync.test.mjs
          node test/notification-click.test.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Firestore test emulator
        id: firestore-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Download the test emulator before running rules checks
        if: steps.firestore-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout 180s pnpm exec firebase setup:emulators:firestore; then exit 0; fi
            echo "Emulator download did not finish (attempt $attempt of 3)."
          done
          exit 1

      - name: Both players obey the real Firestore game rules
        run: pnpm exec firebase emulators:exec --project demo-little-list --only firestore --config firebase.test.json "node test/word-rules.test.mjs && node test/timed-rules.test.mjs && node test/game-rules.test.mjs"

      - name: Delivery layer behaves
        run: node test/delivery.test.mjs

      - name: Push registration goes to the right phone
        run: node test/push-client.test.mjs

      - name: Notifications have one delivery owner
        run: node test/notification-paths.test.mjs

      - name: Repeating tasks roll to a date in the future
        run: node test/recurrence.test.mjs

      - name: Location and status timing regressions
        run: node test/audit-regressions.test.mjs

      - name: Saved spots match where you are, and let go when you leave
        run: node test/places.test.mjs

      - name: Things that were merged behave as one
        run: node test/merged.test.mjs

      - name: Every module the pages load works offline after an update
        run: node test/precache.test.mjs

      - name: The app can still start with no network
        run: node test/offline.test.mjs && node test/cache-lifetime.test.mjs

      - name: Push encryption and the delivery worker behave
        run: |
          node test/webpush.test.mjs
          node test/delivery-worker.test.mjs
          node test/immediate-delivery.test.mjs

      - name: Every page the service worker precaches exists
        run: |
          node -e '
            const fs = require("fs");
            const sw = fs.readFileSync("service-worker.js", "utf8");
            const listed = [...sw.matchAll(/'"'"'\.\/([^'"'"']+)'"'"'/g)].map(m => m[1]).filter(Boolean);
            const missing = listed.filter(name => !fs.existsSync(name));
            if (missing.length) { console.error("precached but missing:", missing); process.exit(1); }
            console.log(`all ${listed.length} precached files exist`);
          '

      - name: No page asks for a file the cache cannot match
        run: |
          node -e '
            const fs = require("fs");
            const bad = [];
            for (const page of fs.readdirSync(".").filter(f => f.endsWith(".html"))) {
              const html = fs.readFileSync(page, "utf8");
              for (const m of html.matchAll(/(?:src|href)="([^":]+\?[^"]*)"/g)) bad.push(`${page} -> ${m[1]}`);
            }
            if (bad.length) {
              console.error("local asset requested with a query string:", bad);
              console.error("the service worker precaches the bare path, so these are never served offline.");
              process.exit(1);
            }
            console.log("no page asks for a local file with a query string");
          '

      - name: household.js and firestore.rules agree
        run: |
          node -e '
            const fs = require("fs");
            const js = fs.readFileSync("household.js", "utf8");
            const rules = fs.readFileSync("firestore.rules", "utf8");
            const ids = [...js.matchAll(/([A-Za-z0-9_]{20,})/g)].map(m => m[1])
              .filter(v => !v.startsWith("HOUSEHOLD") && !v.startsWith("MEMBERS"));
            const missing = [...new Set(ids)].filter(id => !rules.includes(id));
            if (missing.length) {
              console.error("in household.js but not in firestore.rules:", missing);
              console.error("the rules would lock that account out of the household.");
              process.exit(1);
            }
            console.log("every id in household.js appears in firestore.rules");
          '

      - name: Browser flows fit a phone and stay script-error free
        run: |
          pnpm exec playwright install --with-deps chromium
          node -e "const fs=require('fs'); const p='firebase-config.js'; fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace(/apiKey:\s*'[^']+'/, \"apiKey: 'REPLACE_ME'\"));"
          python3 -c "import http.server; http.server.ThreadingHTTPServer.request_queue_size=128; http.server.test(HandlerClass=http.server.SimpleHTTPRequestHandler,ServerClass=http.server.ThreadingHTTPServer,port=8777,bind='127.0.0.1')" >/tmp/our-little-list-http.log 2>&1 &
          pnpm run test:browser
          node test/touch-polish-browser.mjs
          pnpm run test:visual
          pnpm exec firebase emulators:exec --project demo-little-list --only firestore --config firebase.test.json "node test/immediate-emulator.mjs && node test/routines-realtime-browser.mjs && node test/word-realtime-browser.mjs"
