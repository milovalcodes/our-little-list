name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every module parses
        run: |
          for file in *.js tools/*.mjs worker/src/*.js; do
            node --check "$file"
          done

      - name: Delivery layer behaves
        run: node test/delivery.test.mjs

      - name: Push encryption and the delivery worker behave
        run: |
          npm install --no-save --no-audit --no-fund http_ece web-push
          node test/webpush.test.mjs
          node test/delivery-worker.test.mjs

      - name: Every page the service worker precaches exists
        run: |
          node -e '
            const fs = require("fs");
            const sw = fs.readFileSync("service-worker.js", "utf8");
            const listed = [...sw.matchAll(/'"'"'\.\/([^'"'"']+)'"'"'/g)].map(m => m[1]).filter(Boolean);
            const missing = listed.filter(name => !fs.existsSync(name));
            if (missing.length) { console.error("precached but missing:", missing); process.exit(1); }
            console.log(`all ${listed.length} precached files exist`);
          '

      - name: household.js and firestore.rules agree
        run: |
          node -e '
            const fs = require("fs");
            const js = fs.readFileSync("household.js", "utf8");
            const rules = fs.readFileSync("firestore.rules", "utf8");
            const ids = [...js.matchAll(/([A-Za-z0-9_]{20,})/g)].map(m => m[1])
              .filter(v => !v.startsWith("HOUSEHOLD") && !v.startsWith("MEMBERS"));
            const missing = [...new Set(ids)].filter(id => !rules.includes(id));
            if (missing.length) {
              console.error("in household.js but not in firestore.rules:", missing);
              console.error("the rules would lock that account out of the household.");
              process.exit(1);
            }
            console.log("every id in household.js appears in firestore.rules");
          '
