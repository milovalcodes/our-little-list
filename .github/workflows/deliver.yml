name: Deliver reminders

# Manual backstop only. Delivery is scheduled by the Cloudflare Worker in
# worker/ — GitHub treats scheduled workflows as its lowest-priority queue and
# was firing this */5 cron roughly every four hours, which is not a reminder.
#
# The schedule is deliberately gone: two schedulers sending the same outbox
# means every notification arrives twice.
on:
  workflow_dispatch:

concurrency:
  group: deliver
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: tools
        run: npm install --omit=dev --no-audit --no-fund
      - name: Send what is due
        working-directory: tools
        env:
          LITTLE_EMAIL: ${{ secrets.LITTLE_EMAIL }}
          LITTLE_PASSWORD: ${{ secrets.LITTLE_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node deliver.mjs
