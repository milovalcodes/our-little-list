name: Keep the schedule alive

# GitHub switches scheduled workflows off after 60 days with no repository
# activity — and a workflow run does not count as activity, only a commit does.
# This nudges a timestamp once a month so the reminder delivery keeps running
# even during a quiet stretch.
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch the heartbeat file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-heartbeat
          git diff --staged --quiet || git commit -m "Keep scheduled delivery enabled"
          git push
