<!doctype html>
<html lang="en">
<head><meta name="apple-mobile-web-app-title" content="Our Little App"><script src="appearance-boot.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Activities · Our Little App</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png">
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="diary.css">
  <script src="seasonal-assets.js"></script><script src="seasonal-theme.js"></script><link rel="stylesheet" href="seasonal.css">
<link rel="stylesheet" href="app-life.css"><link rel="stylesheet" href="activities-layout.css">
</head>
<body class="profile-page" data-app="activities">
  <main class="app-shell feature-shell">
    <section class="feature-hero"><h1>Activities</h1></section>
    <section id="daily" class="daily-activities" aria-label="Daily activities">
      <p class="daily-date" id="daily-date"></p>
      <details open class="daily-entry" id="daily-question"><summary><span class="daily-stamp" aria-hidden="true">☀☾</span><span><strong>Our question</strong><small id="question-summary">a little check-in</small></span><span class="daily-chevron" aria-hidden="true">⌄</span></summary>
    <section class="today-card question-card" id="question">
      <div class="today-card-head"><div><p class="tiny-kicker">one question a day</p><h2 id="question-prompt">loading today’s question…</h2></div><button id="question-reveal" type="button" hidden>see answers</button></div>
      <form id="question-form"><label><span>your answer</span><textarea id="question-answer" maxlength="240" rows="2" placeholder="say the thing" required></textarea></label><button class="primary-action" id="question-save" type="submit">answer</button></form>
      <div class="question-answers" id="question-answers" aria-live="polite"></div>
      <button class="question-edit" id="question-edit" type="button" hidden>edit my answer</button>
    </section>
      </details>
    </section>
    <section class="daily-entry wins-history" id="scoreboard" aria-labelledby="wins-title"><header class="activity-panel-heading"><h2 id="wins-title">Our wins</h2></header><div id="wins-history" aria-live="polite"><p>Loading our wins…</p></div></section>
  </main>
  <div id="auth-root"></div>
  <script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="activities.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
