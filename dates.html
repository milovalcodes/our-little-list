<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Date ideas · Our Little List</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="diary.css">
  <script src="seasonal-assets.js"></script>
  <script src="seasonal-theme.js"></script>
  <link rel="stylesheet" href="seasonal.css">
</head>
<body class="profile-page" data-app="dates">
  <header class="app-topbar"><a class="home-link back-to-side" href="index.html">← home</a><span class="mini-brand">date ideas ✦</span></header>
  <main class="app-shell feature-shell dates-shell">
    <section class="feature-hero dates-hero"><span class="feature-icon">✦</span><p class="tiny-kicker">for when we ask “what do u wanna do”</p><h1>Date ideas</h1></section>
    <section class="composer-card date-composer" hidden>
      <form id="date-form"><label><span>the idea</span><input id="date-title" required maxlength="100" placeholder="late-night pancakes"></label><details class="date-more-details" id="date-more-details"><summary>more details <span>optional</span></summary><label><span>extra detail, if any</span><textarea id="date-note" maxlength="180" placeholder="the place with the tiny mugs"></textarea></label>
        <div class="date-vibes"><button class="date-vibe active" data-vibe="go out" type="button">go out</button><button class="date-vibe" data-vibe="stay in" type="button">stay in</button><button class="date-vibe" data-vibe="food" type="button">food</button><button class="date-vibe" data-vibe="little trip" type="button">little trip</button></div>
        <div class="date-detail-grid"><label><span>budget</span><select id="date-cost"><option value="free">free-ish</option><option value="low" selected>cheap</option><option value="medium">normal money</option><option value="treat">a treat</option></select></label><label><span>energy</span><select id="date-energy"><option value="low">horizontal</option><option value="medium" selected>some</option><option value="high">adventure</option></select></label><label><span>weather</span><select id="date-weather"><option value="either" selected>either</option><option value="indoor">inside</option><option value="outdoor">outside</option></select></label><label><span>distance</span><select id="date-distance"><option value="home">at home</option><option value="nearby" selected>nearby</option><option value="drive">worth a drive</option></select></label><label><span>time</span><select id="date-duration"><option value="short">about an hour</option><option value="evening" selected>an evening</option><option value="day">a whole thing</option></select></label></div></details>
        <button class="primary-action" id="date-submit" type="submit">save idea</button>
      </form>
    </section>
    <section class="random-date-card date-roulette"><div class="roulette-head"><div><p class="tiny-kicker">decision machine</p><h2>Pick one for us</h2></div></div><div class="roulette-filters" aria-label="Pick a vibe and budget"><div class="roulette-chip-group" aria-label="Vibe"><span>vibe</span><button type="button" class="active" data-filter-vibe="any" aria-pressed="true">any</button><button type="button" data-filter-vibe="go out" aria-pressed="false">go out</button><button type="button" data-filter-vibe="stay in" aria-pressed="false">stay in</button><button type="button" data-filter-vibe="food" aria-pressed="false">food</button><button type="button" data-filter-vibe="little trip" aria-pressed="false">trip</button></div><div class="roulette-chip-group" aria-label="Budget"><span>budget</span><button type="button" class="active" data-filter-cost="any" aria-pressed="true">any</button><button type="button" data-filter-cost="free" aria-pressed="false">free</button><button type="button" data-filter-cost="low" aria-pressed="false">cheap</button><button type="button" data-filter-cost="medium" aria-pressed="false">usual</button><button type="button" data-filter-cost="treat" aria-pressed="false">treat</button></div></div><button id="pick-random" type="button">surprise us ✦</button><p id="random-date">we surrender to the button.</p><form class="date-plan" id="date-plan" hidden><label>pick a day <input id="date-plan-day" type="date" required></label><button type="submit">let’s do it ✓</button></form></section>
    <section class="list-card date-list-card"><div class="list-heading"><div><p class="tiny-kicker">the pile</p><h2>Ideas</h2></div><button class="page-add" type="button" data-open-sheet="date-form">＋ add</button><span class="count-bubble" id="date-count">0 saved</span></div><div class="empty-state" id="date-empty"><span>✦</span><strong>No ideas yet</strong><button class="empty-add" type="button" data-open-sheet="date-form">＋ add the first one</button></div><div class="date-list" id="date-list"></div><button class="create-space date-more" id="date-more" type="button" hidden>show more</button></section>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="dates.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
