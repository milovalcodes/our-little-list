<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Date Ideas</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="sun-moon-personalized.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page" data-app="dates">
  <header class="app-topbar"><a class="home-link back-to-side" href="index.html">← back</a><span class="mini-brand">future plans ✦</span></header>
  <main class="app-shell feature-shell dates-shell">
    <section class="feature-hero dates-hero"><span class="feature-icon">✦</span><p class="tiny-kicker">for when we ask “what do u wanna do”</p><h1>Date ideas</h1></section>
    <section class="composer-card date-composer">
      <form id="date-form"><label><span>the idea</span><input id="date-title" required maxlength="100" placeholder="late-night pancakes"></label><label><span>extra detail, if any</span><textarea id="date-note" maxlength="180" placeholder="the place with the tiny mugs"></textarea></label>
        <div class="date-vibes"><button class="date-vibe active" data-vibe="go out" type="button">go out</button><button class="date-vibe" data-vibe="stay in" type="button">stay in</button><button class="date-vibe" data-vibe="food" type="button">food</button><button class="date-vibe" data-vibe="little trip" type="button">little trip</button></div>
        <div class="date-detail-grid"><label><span>budget</span><select id="date-cost"><option value="free">free-ish</option><option value="low" selected>cheap</option><option value="medium">normal money</option><option value="treat">a treat</option></select></label><label><span>energy</span><select id="date-energy"><option value="low">horizontal</option><option value="medium" selected>some</option><option value="high">adventure</option></select></label><label><span>weather</span><select id="date-weather"><option value="either" selected>either</option><option value="indoor">inside</option><option value="outdoor">outside</option></select></label><label><span>distance</span><select id="date-distance"><option value="home">at home</option><option value="nearby" selected>nearby</option><option value="drive">worth a drive</option></select></label><label><span>time</span><select id="date-duration"><option value="short">about an hour</option><option value="evening" selected>an evening</option><option value="day">a whole thing</option></select></label></div>
        <button class="primary-action" id="date-submit" type="submit">save idea</button>
      </form>
    </section>
    <section class="random-date-card date-roulette"><div class="roulette-head"><div><p class="tiny-kicker">decision machine</p><h2>Pick one for us</h2></div><button id="pick-random" type="button">surprise us ✦</button></div><div class="roulette-filters"><select id="filter-cost" aria-label="Budget"><option value="any">any budget</option><option value="free">free-ish</option><option value="low">cheap</option><option value="medium">normal money</option><option value="treat">a treat</option></select><select id="filter-energy" aria-label="Energy"><option value="any">any energy</option><option value="low">horizontal</option><option value="medium">some energy</option><option value="high">adventure</option></select><select id="filter-weather" aria-label="Weather"><option value="any">any weather</option><option value="indoor">inside</option><option value="outdoor">outside</option></select><select id="filter-distance" aria-label="Distance"><option value="any">any distance</option><option value="home">at home</option><option value="nearby">nearby</option><option value="drive">worth a drive</option></select><select id="filter-duration" aria-label="Time"><option value="any">any amount of time</option><option value="short">about an hour</option><option value="evening">an evening</option><option value="day">a whole thing</option></select></div><p id="random-date">we surrender to the button.</p></section>
    <section class="list-card date-list-card"><div class="list-heading"><div><p class="tiny-kicker">the pile</p><h2>Ideas</h2></div><span class="count-bubble" id="date-count">0 saved</span></div><div class="empty-state" id="date-empty"><span>✦</span><strong>No ideas yet</strong></div><div class="date-list" id="date-list"></div><button class="create-space date-more" id="date-more" type="button" hidden>show more</button></section>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="dates.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
