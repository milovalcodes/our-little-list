<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4c95d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Sun Side · Our Little List</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="sun-moon-personalized.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page her-theme compact-dashboard" data-viewer="her">
  <header class="app-topbar"><button class="home-link" id="sign-out" type="button">sign out</button><span class="home-wordmark">our little sky ☀︎☾</span><a class="sky-inbox-link" href="activity.html" aria-label="Recent activity">↻<span class="activity-badge" id="activity-badge" hidden>0</span></a></header>
  <main class="app-shell dashboard-shell">
    <section class="our-sky" aria-labelledby="sky-greeting">
      <header class="sky-heading">
        <div><p class="tiny-kicker">our sky</p><h1 id="sky-greeting" data-person-name="sun" data-person-fallback="pretty" data-person-format="hi {name}">hi pretty</h1></div>
        <span class="sky-time" id="sky-time">some time today</span>
      </header>
      <div class="sky-stage" id="sky-stage" data-orbit="waiting">
        <i class="sky-star s1">✦</i><i class="sky-star s2">·</i><i class="sky-star s3">✧</i><i class="sky-star s4">·</i><i class="sky-star s5">✦</i>
        <a class="sky-person sky-sun is-self" id="sky-person-her" href="status.html" aria-label="Open your status">
          <span class="sky-status-bubble" id="sky-status-her" hidden></span>
          <span class="sky-avatar"><img src="sun-profile.png" alt=""><i class="sky-presence" id="sky-presence-her"></i><em class="sky-reaction" id="sky-reaction-her" hidden></em></span>
          <span class="sky-person-label"><strong id="sky-name-her">her</strong><small id="sky-seen-her">somewhere</small></span>
        </a>
        <a class="sky-person sky-moon" id="sky-person-him" href="status.html#partner" aria-label="See the moon right now">
          <span class="sky-status-bubble" id="sky-status-him" hidden></span>
          <span class="sky-avatar"><img src="moon-profile.png" alt=""><i class="sky-presence" id="sky-presence-him"></i><em class="sky-reaction" id="sky-reaction-him" hidden></em></span>
          <span class="sky-person-label"><strong id="sky-name-him">him</strong><small id="sky-seen-him">somewhere</small></span>
        </a>
        <a class="sky-note-star" id="sky-note-star" href="notes.html" hidden><span>💌</span><small id="sky-note-copy"></small></a>
        <span class="sky-wins" id="sky-wins" hidden></span>
      </div>
      <footer class="sky-footer">
        <span><strong id="sky-orbit-title">orbit loading…</strong><small id="sky-orbit-detail">finding both of you</small></span>
        <a href="status.html">right now →</a>
      </footer>
    </section>

    <nav class="sky-launchpad" aria-label="Open a part of our app">
      <a class="sky-launch today-action" href="today.html"><span>◎</span><strong>today</strong></a>
      <a class="sky-launch list-action" href="tasks.html"><span>✓</span><span class="activity-badge" id="help-badge" hidden>0</span><strong>the list</strong></a>
      <a class="sky-launch note-action" href="notes.html"><span>💌</span><strong>notes</strong></a>
      <a class="sky-launch reminder-action" href="reminders.html"><span>⏰</span><strong>reminder</strong></a>
      <a class="sky-launch date-action" href="dates.html"><span>✦</span><strong>date pile</strong></a>
      <a class="sky-launch memory-action" href="memories.html"><span>◒</span><strong>memories</strong></a>
    </nav>
    <span id="home-location-state" hidden>starting…</span>
    <nav class="home-utility-row" aria-label="Settings"><a href="phone-check.html">phone check</a><span>·</span><a href="profiles.html">our names</a></nav>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="dashboard.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
