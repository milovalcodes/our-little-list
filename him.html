<!doctype html>
<html lang="en">
<head><meta name="apple-mobile-web-app-title" content="Our Little App"><script src="appearance-boot.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1730"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Moon Side · Our Little App</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="diary.css">
  <script src="seasonal-assets.js"></script>
  <script src="seasonal-theme.js"></script>
  <link rel="stylesheet" href="seasonal.css">
</head>
<body class="profile-page him-theme compact-dashboard" data-viewer="him">
  <header class="app-topbar"><span class="home-wordmark">our little app ☀︎☾</span></header>
  <main class="app-shell dashboard-shell">
    <section class="our-sky" aria-labelledby="sky-greeting">
      <header class="sky-heading">
        <div><p class="tiny-kicker">our sky</p><h1 id="sky-greeting" data-person-name="moon" data-person-fallback="you" data-person-format="hi {name}">hi you</h1></div>
        <span class="sky-time" id="sky-time">some time today</span>
      </header>
      <div class="sky-stage" id="sky-stage" data-orbit="waiting">
        <i class="sky-star s1">✦</i><i class="sky-star s2">·</i><i class="sky-star s3">✧</i><i class="sky-star s4">·</i><i class="sky-star s5">✦</i>
        <div class="sky-person sky-sun" id="sky-person-her">
          <span class="sky-status-bubble" id="sky-status-her" hidden></span>
          <button type="button" class="sky-avatar alter-ego-trigger" data-person="her" data-profile-url="status.html#profile-her" aria-label="Open profile"><img src="sun-profile.png" alt=""><i class="sky-presence" id="sky-presence-her"></i><em class="sky-reaction" id="sky-reaction-her" hidden></em></button>
          <a class="sky-person-label" href="status.html#profile-her"><strong id="sky-name-her">her</strong><small id="sky-seen-her">somewhere</small></a>
        </div>
        <div class="sky-person sky-moon is-self" id="sky-person-him">
          <span class="sky-status-bubble" id="sky-status-him" hidden></span>
          <button type="button" class="sky-avatar alter-ego-trigger" data-person="him" data-profile-url="status.html#profile-him" aria-label="Open profile"><img src="moon-profile.png" alt=""><i class="sky-presence" id="sky-presence-him"></i><em class="sky-reaction" id="sky-reaction-him" hidden></em></button>
          <a class="sky-person-label" href="status.html#profile-him"><strong id="sky-name-him">him</strong><small id="sky-seen-him">somewhere</small></a>
        </div>

        <span class="sky-wins" id="sky-wins" hidden></span>
      </div>
      <footer class="sky-footer">
        <span><strong id="sky-orbit-title">orbit loading…</strong><small id="sky-orbit-detail">finding both of you</small></span>
      </footer>
    </section>

    <section class="home-next-up" aria-label="Today"><div class="home-today-heading"><h2>Today</h2><button type="button" data-open-sheet="focus">⏱ focus</button></div><div id="home-next-up"><p>checking our stuff…</p></div></section>
    <section class="today-card focus-card">
      <div class="today-card-head"><div><p class="tiny-kicker">body double</p><h2>Lock in together</h2></div><span>⏱</span></div>
      <div class="focus-pair" id="focus-pair"></div>
      <form class="focus-form" id="focus-form">
        <input id="focus-label" maxlength="70" placeholder="what are we fighting today?">
        <div class="focus-presets" id="focus-presets"><button type="button" data-minutes="15" class="active">15m</button><button type="button" data-minutes="30">30m</button><button type="button" data-minutes="45">45m</button></div>
        <button class="primary-action" id="focus-start" type="submit">start focus</button>
      </form>
    </section>

    <details class="today-new home-updates" id="new"><summary>Updates <span class="count-bubble" id="new-count" hidden>0</span></summary>
      <section class="activity-card">
        <div class="activity-heading"><button id="mark-seen" type="button">mark all seen</button></div>
        <div class="empty-state" id="activity-empty"><span>✦</span><strong>Nothing new</strong></div>
        <ol class="activity-list" id="activity-list"></ol>
        <button class="activity-see-all" id="activity-see-all" type="button" hidden>see all</button>
      </section>
    </details>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="dashboard.js"></script><script type="module" src="home-extras.js"></script><script type="module" src="live-notes.js"></script><script type="module" src="setup-nudge.js"></script>
</body>
</html>
