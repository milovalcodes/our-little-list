<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Our Little List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="sun-moon-personalized.png" type="image/png">
  <link rel="apple-touch-icon" href="sun-moon-personalized.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing">
  <div class="sky-doodle d1">☀</div>
  <div class="sky-doodle d2">☾</div>
  <div class="sky-doodle d3">✦</div>
  <main class="landing-shell">
    <header class="landing-copy">
      <img class="landing-pair" src="sun-moon-personalized.png" alt="Our sun and moon, wearing their glasses">
      <p class="tiny-kicker">our little corner ☀︎☾</p>
      <h1>hi you</h1>
      <p>just ours ♡</p>
    </header>

    <section class="entry-state" aria-live="polite">
      <p id="entry-note">getting you in…</p>
    </section>

    <div class="install-corner">
      <div class="install-actions">
        <button id="install-app" type="button">add to my phone</button>
      </div>
      <p id="install-hint">keep our little place close.</p>
    </div>
    <p class="landing-profile-link"><a href="profiles.html">set up our names ✎</a></p>
    <p class="landing-foot">just ours ☀︎☾</p>
  </main>
  <div id="auth-root"></div>
  <script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="entry.js"></script>
</body>
</html>
