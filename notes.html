<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>A Tiny Note</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="diary.css">
</head>
<body class="profile-page" data-app="notes">
  <header class="app-topbar"><a class="home-link back-to-side" href="index.html">← home</a><span class="mini-brand">notes 💌</span></header>
  <main class="app-shell feature-shell note-shell">
    <section class="feature-hero note-hero"><span class="feature-icon">💌</span><p class="tiny-kicker">just because</p><h1 id="note-heading">Notes</h1></section>
    <section class="list-card note-inbox-card" aria-label="Our notes">
      <div class="empty-state" id="note-inbox-empty"><span>◌</span><strong>No notes yet</strong><p>write one at the bottom</p></div>
      <div class="note-inbox-list" id="note-inbox-list"></div>
      <button class="create-space note-more" id="note-more" type="button" hidden>show more</button>
    </section>
    <form class="note-quick-compose" id="note-quick-form" aria-label="Write a note"><div class="note-starters" id="note-starters" hidden><button type="button">thinking of u ♡</button><button type="button">proud of u</button><button type="button">miss ur face</button><button type="button">drink water pls</button><button type="button">hurry up i miss u</button></div><button class="note-mood" id="note-mood" type="button" data-mood="heart" aria-label="Mood: 💛 — tap to change">💛</button><input id="note-quick-text" data-dock-focus maxlength="180" required autocomplete="off" placeholder="write her a little note…"><button id="note-quick-send" type="submit" aria-label="Send note">↑</button></form>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="notes.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
