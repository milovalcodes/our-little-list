<!doctype html>
<html lang="en">
<head><meta name="apple-mobile-web-app-title" content="Our Little App"><script src="appearance-boot.js"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>The list · Our Little App</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="diary.css">
  <script src="seasonal-assets.js"></script>
  <script src="seasonal-theme.js"></script>
  <link rel="stylesheet" href="seasonal.css">
</head>
<body class="profile-page" data-app="tasks">
  <header class="app-topbar"><a class="home-link back-to-side" href="index.html">← home</a><span class="mini-brand">the list ☀︎☾</span></header>
  <main class="app-shell feature-shell">
    <section class="feature-hero list-hero">
      <span class="feature-icon">✓</span><p class="tiny-kicker">for both of us</p><h1>The list</h1>
    </section>

    <nav class="tabs" aria-label="List sections">
      <button class="tab active" data-tab="tasks">To do</button><button class="tab" data-tab="routines">Routines</button><button class="tab" data-tab="grocery">Groceries</button><button class="tab" data-tab="done">Done</button>
    </nav>
    <button class="page-add" id="page-add" type="button" data-open-sheet="task-form">＋ add</button>

    <section class="composer-card compact-composer" id="task-composer" hidden>
      <form id="shared-task-form">
        <label><span id="task-prompt">What needs doing?</span><div class="inline-add"><input id="shared-task-title" required maxlength="100" placeholder="type it before it leaves your brain"><button type="submit" aria-label="Add">+</button></div></label>
        <fieldset id="routine-days" hidden><legend>Which days?</legend><div class="routine-days"></div><small>Resets at midnight · Eastern time</small></fieldset>
        <details class="compose-more"><summary id="task-more-summary">⋯ when / repeat / reminders</summary><div class="soft-options" id="task-options">
          <button type="button" class="soft-chip active" data-when="whenever">any day</button><button type="button" class="soft-chip" data-when="today">today</button><button type="button" class="soft-chip" data-when="tomorrow">tomorrow</button>
        </div>
        <div class="task-extra-row"><div class="soft-options" id="repeat-options"><button type="button" class="repeat-chip active" data-repeat="once">one time</button><button type="button" class="repeat-chip" data-repeat="daily">daily</button><button type="button" class="repeat-chip" data-repeat="weekly">weekly</button><button type="button" class="repeat-chip" data-repeat="monthly">monthly</button></div><label id="grocery-aisle-wrap" hidden><span>aisle-ish</span><select id="grocery-aisle"><option value="produce">produce</option><option value="fridge">fridge</option><option value="pantry">pantry</option><option value="frozen">frozen</option><option value="home">home stuff</option><option value="other">other</option></select></label></div>
        <div id="task-reminders"></div></details>
      </form>
    </section>

    <section class="recent-groceries" id="recent-groceries" hidden aria-label="Recent groceries"><span>recent grabs</span><div id="recent-grocery-chips"></div></section>

    <section class="list-card" id="task-list-card">
      <div class="list-heading"><div><p class="tiny-kicker" id="list-kicker">our things</p><h2 id="list-title">To do</h2></div><span class="count-bubble" id="item-count">0 left</span></div>
      <div class="empty-state" id="empty-state"><span>✦</span><strong>Nothing here</strong><p></p></div>
      <ul class="task-list" id="task-list"></ul>
    </section>

  </main>

  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="tasks.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
