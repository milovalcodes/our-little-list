<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
  <title>Today · Our Little List</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="sun-moon-personalized.png" type="image/png"><link rel="apple-touch-icon" href="sun-moon-personalized.png"><link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page" data-app="today">
  <header class="app-topbar"><a class="home-link back-to-side" href="index.html">← back</a><span class="mini-brand">today-ish</span></header>
  <main class="app-shell feature-shell today-shell">
    <section class="feature-hero today-hero"><span class="feature-icon">◎</span><p class="tiny-kicker" id="today-date">today</p><h1>Today</h1></section>

    <section class="today-card">
      <div class="today-card-head"><div><p class="tiny-kicker">on deck</p><h2>What actually matters</h2></div><span class="count-bubble" id="today-count">0</span></div>
      <div class="today-list" id="today-list"></div>
      <div class="empty-state" id="today-empty"><span>✓</span><strong>Nothing urgent</strong></div>
    </section>

    <section class="today-card focus-card">
      <div class="today-card-head"><div><p class="tiny-kicker">body double</p><h2>Lock in together</h2></div><span>⏱</span></div>
      <div class="focus-pair" id="focus-pair"></div>
      <form class="focus-form" id="focus-form">
        <input id="focus-label" maxlength="70" placeholder="what are we fighting today?">
        <div class="focus-presets" id="focus-presets"><button type="button" data-minutes="15" class="active">15m</button><button type="button" data-minutes="30">30m</button><button type="button" data-minutes="45">45m</button></div>
        <button class="primary-action" id="focus-start" type="submit">start focus</button>
      </form>
    </section>
  </main>
  <div id="auth-root"></div><script src="shared.js"></script><script type="module" src="profile-names.js"></script><script type="module" src="today.js"></script><script type="module" src="live-notes.js"></script>
</body>
</html>
